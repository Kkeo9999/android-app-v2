
name: Build My Money Reset APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        run: |
          if [ ! -f "MyMoneyResetAndroid_Project_Updated.zip" ]; then
            echo "ERROR: ZIP file not found in repository root"
            ls -la
            exit 1
          unzip -q MyMoneyResetAndroid_Project_Updated.zip -d extracted
          if [ ! -d "extracted/MyMoneyResetAndroid" ]; then
            echo "ERROR: Android project folder not found inside ZIP"
            find extracted -maxdepth 3 -type d
            exit 1
          fi

      - name: Build Android APK
        run: |
          cd extracted/MyMoneyResetAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyMoneyReset-APK
          path: extracted/MyMoneyResetAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
