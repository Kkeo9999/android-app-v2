
name: Build My Money Reset APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: |
          if [ ! -d "MyMoneyResetAndroid" ]; then
            echo "ERROR: Missing MyMoneyResetAndroid project folder"
            exit 1
          fi
          cd MyMoneyResetAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyMoneyReset-APK
          path: MyMoneyResetAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
